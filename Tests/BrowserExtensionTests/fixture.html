<!doctype html><html lang="en"><meta charset="utf-8"><title>SmartApp Browser Fixture</title>
<h1>SmartApp Browser Fixture</h1><p>Synthetic acceptance fixture only.</p>
<button id="spa">Navigate SPA route</button>
<button id="fragment">Change fragment</button>
<a href="/background?smartapp_extension_test=background#kept" target="_blank">Open background fixture</a>
<p id="location"></p>
<script>
const show=()=>document.querySelector('#location').textContent=location.pathname+location.search+location.hash;
document.querySelector('#spa').onclick=()=>{history.pushState({},'', '/detail?smartapp_extension_test=spa#section');show();};
document.querySelector('#fragment').onclick=()=>{location.hash='second-section';show();};
show();
</script></html>
